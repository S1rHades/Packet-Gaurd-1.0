name: Build Packet Guard APK

# Every push and pull request is tested and built; the APKs are kept as a workflow artifact.
# A GitHub release is published only from `main`, and only once per versionName: bump
# versionName (and versionCode) in app/build.gradle.kts to ship a new release.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ByeDPI-Guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Read version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # The release keystore lives in repository secrets. Without it (forks, pull requests,
      # or before the secrets are set up) the workflow falls back to a debug build.
      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "PG_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 is not set, so this build is debug-signed and cannot update a release install."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs
        env:
          PG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.variant }}" = release ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Name the APKs
        run: |
          VARIANT=${{ steps.signing.outputs.variant }}
          SUFFIX=$([ "$VARIANT" = debug ] && echo "-debug" || true)
          mkdir -p ../dist
          for f in app/build/outputs/apk/$VARIANT/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e "s/-$VARIANT\$//")
            cp "$f" "../dist/PacketGuard-v${{ steps.version.outputs.name }}-${abi}${SUFFIX}.apk"
          done
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Packet-Guard-${{ steps.signing.outputs.variant }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.variant == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName to publish a new one."
            exit 0
          fi
          # The app's updater shows the first bullets under "## What's new", so copy this
          # version's section of the changelog in README-PACKET-GUARD.md.
          NOTES=$(awk -v v="## Version ${{ steps.version.outputs.name }}" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }' README-PACKET-GUARD.md)
          {
            echo "## What's new"
            echo
            echo "${NOTES:-- Bug fixes and improvements.}"
            echo
            echo "## Install"
            echo
            echo "Download PacketGuard-$TAG-universal.apk below and install it on your Android phone. It works on every device; the other files are smaller per-processor builds. Packet Guard 2.5.0 and later can also update themselves: Settings → About → Updates."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" ../dist/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Packet Guard $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
