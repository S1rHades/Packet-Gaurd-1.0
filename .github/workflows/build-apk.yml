name: Build Packet Guard APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ByeDPI-Guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APKs
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p ../dist
          for f in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-debug$//')
            cp "$f" "../dist/PacketGuard-v${VERSION}-${abi}.apk"
          done
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Packet-Guard-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release create "v${VERSION}-build${{ github.run_number }}" ../dist/*.apk \
            --repo "${{ github.repository }}" \
            --title "Packet Guard v${VERSION} (build ${{ github.run_number }})" \
            --notes "Download PacketGuard-v${VERSION}-universal.apk below and install it on your Android phone. It works on every device; the other files are smaller per-processor builds."
