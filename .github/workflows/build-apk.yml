name: Build Packet Guard APK

# Every push and pull request is tested and built; the APKs are kept as a workflow artifact.
# A GitHub release is published only from `main`, and only once per versionName: bump
# versionName (and versionCode) in app/build.gradle.kts to ship a new release.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ByeDPI-Guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon

      # Screenshots of the main screens (English and Russian) against the
      # images in app/src/test/snapshots. After an intended change: ./gradlew recordPaparazziDebug.
      - name: Screenshot tests
        run: ./gradlew verifyPaparazziDebug --no-daemon

      - name: Keep screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: |
            ByeDPI-Guard/app/out/failures
            ByeDPI-Guard/app/build/paparazzi/failures
          if-no-files-found: ignore

      - name: Read version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # The release keystore lives in repository secrets. Without it (forks, pull requests,
      # or before the secrets are set up) the workflow falls back to a debug build.
      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "PG_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 is not set, so this build is debug-signed and cannot update a release install."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs
        env:
          PG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.variant }}" = release ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Name the APKs
        run: |
          VARIANT=${{ steps.signing.outputs.variant }}
          SUFFIX=$([ "$VARIANT" = debug ] && echo "-debug" || true)
          mkdir -p ../dist
          for f in app/build/outputs/apk/$VARIANT/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e "s/-$VARIANT\$//")
            cp "$f" "../dist/PacketGuard-v${{ steps.version.outputs.name }}-${abi}${SUFFIX}.apk"
          done
          # A copy under a name that never changes, for the README's download link
          # (releases/latest/download/PacketGuard.apk).
          if [ "$VARIANT" = release ]; then
            cp "../dist/PacketGuard-v${{ steps.version.outputs.name }}-universal.apk" ../dist/PacketGuard.apk
          fi
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Packet-Guard-${{ steps.signing.outputs.variant }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.variant == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName to publish a new one."
            exit 0
          fi
          # The app's updater shows the first bullets under "## What's new", so copy this
          # version's section of CHANGELOG.md ("## 2.5.1 (November 2026)").
          NOTES=$(awk -v v="## ${{ steps.version.outputs.name }} " '
            index($0, v) == 1 || $0 == substr(v, 1, length(v) - 1) { on = 1; next }
            on && /^## / { exit }
            on { print }' ../CHANGELOG.md)
          {
            echo "## What's new"
            echo
            echo "${NOTES:-- Bug fixes and improvements.}"
            echo
            echo "## Install"
            echo
            echo "Download PacketGuard.apk below and install it on your Android phone; it works on every device. The other files are the same version: one named after it, and smaller per-processor builds. Packet Guard 2.5.0 and later update themselves: Settings → About → Updates."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" ../dist/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Packet Guard $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # On an Android emulator: open the app, tap the shield, reach Protected, disconnect.
  # Separate from the build job, so it never holds back a release; a failure shows up as a red check.
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ByeDPI-Guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Connect on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: ByeDPI-Guard
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: ByeDPI-Guard/app/build/reports/androidTests
          if-no-files-found: ignore
